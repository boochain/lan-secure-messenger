[workspace]
resolver = "2"
members = ["lan-core", "lan-daemon", "lan-cli"]
default-members = ["lan-core", "lan-daemon", "lan-cli"]

[workspace.package]
version = "0.5.0-beta.2"
edition = "2021"
license = "MIT"
authors = ["Bill Ocean <FREC86>"]
repository = "https://github.com/boochain/lan-secure-messenger"

[workspace.dependencies]
lan-core = { path = "lan-core" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
directories = "5"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
x25519-dalek = { version = "2", features = ["static_secrets", "getrandom"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
chacha20poly1305 = "0.10"
blake3 = "1"
argon2 = "0.5"
blake2 = "0.10"
snow = "0.9"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
hostname = "0.4"
zeroize = { version = "1", features = ["derive"] }
socket2 = { version = "0.5", features = ["all"] }
netdev = "0.46"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
