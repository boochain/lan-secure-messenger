[workspace]
resolver = "2"
members = ["lan-core", "lan-cli", "lan-gui"]
default-members = ["lan-core", "lan-cli"]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT"
authors = ["Bill Ocean <FREC86>"]
repository = "https://github.com/FREC86/lan-secure-messenger"

[workspace.dependencies]
lan-core = { path = "lan-core" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "5"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
x25519-dalek = { version = "2", features = ["static_secrets", "getrandom"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
blake3 = "1"
snow = "0.9"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
hostname = "0.4"
futures = "0.3"
parking_lot = "0.12"
eframe = { version = "0.29", default-features = true }
egui = "0.29"
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
tray-icon = "0.19"
tao = "0.30"
arboard = "3"
zeroize = { version = "1", features = ["derive"] }
socket2 = { version = "0.5", features = ["all"] }
