# Four-surface feature parity table (v0.7.1).
# Platforms checked: winui, xp, gtk3, adw, android
# (GTK3 and GTK4/libadwaita are listed separately so neither Linux UI can lag.)
# CI: python3 tools/check_feature_parity.py
#
# Each feature has one hook id (LSMF_<id>). The checker requires, per platform:
#   implemented     — hook string present in that platform's UI sources
#   automated_test  — a test file that exists and contains the fragment after '#'
#                     (engine / C unit tests are allowed here)
#   gui_verified    — a screenshot/smoke driver that exists and contains the
#                     fragment; unit tests (lan-core/tests/**, c_unit_test.c)
#                     cannot count as GUI verification
# Add the hook next to the real control / handler.

platforms:
  winui:
    roots:
      - ui-winui
  xp:
    roots:
      - editions/portable/src/gui.c
      - editions/portable/src/xp_ux.inc
      - editions/portable/src/xp_p0.inc
      - editions/portable/src/xp_p1.inc
      - editions/portable/src/xp_p2.inc
      - editions/portable/src/xp_v062.inc
      - editions/portable/src/xp_v070.inc
      - editions/portable/src/xp_v071.inc
  gtk3:
    roots:
      - editions/portable/linux/gtk_gui.c
      - editions/portable/linux/gtk_ux.inc
      - editions/portable/linux/gtk_p0.inc
      - editions/portable/linux/gtk_p1.inc
      - editions/portable/linux/gtk_p2.inc
      - editions/portable/linux/gtk_v062.inc
      - editions/portable/linux/gtk_v070.inc
      - editions/portable/linux/gtk_v071.inc
  adw:
    roots:
      - editions/portable/linux/adw_gui.c
      - editions/portable/linux/adw_ux.inc
      - editions/portable/linux/adw_p0.inc
      - editions/portable/linux/adw_p1.inc
      - editions/portable/linux/adw_p2.inc
      - editions/portable/linux/adw_v062.inc
      - editions/portable/linux/adw_v070.inc
      - editions/portable/linux/adw_v071.inc
  android:
    roots:
      - editions/portable/android/app/src/main

