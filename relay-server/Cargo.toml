[package]
name = "relay-server"
version = "0.6.0"
edition = "2021"
license = "MIT"
authors = ["Bill Ocean <boochain>"]
description = "Optional relay for LAN Secure Messenger: forwards end-to-end Noise-encrypted blobs between peers on different networks"
repository = "https://github.com/boochain/lan-secure-messenger"

# Stand-alone workspace: not a member of the root workspace on purpose.
[workspace]

[lib]
name = "relay"
path = "src/lib.rs"

[[bin]]
name = "relay-server"
path = "src/main.rs"

[[bin]]
name = "relay-test-client"
path = "src/bin/relay-test-client.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
rand = "0.8"
hex = "0.4"
argon2 = "0.5"
blake2 = "0.10"
subtle = "2"
chacha20poly1305 = "0.10"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

[target.'cfg(windows)'.dependencies]
windows-service = "0.7"

[profile.dev.package."*"]
opt-level = 2
