name: Release

on:
  push:
    tags: ["v*"]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release
        run: cargo build --release -p lan-cli -p lan-gui
      - name: Stage portable package
        shell: pwsh
        run: |
          $out = "dist/lan-secure-messenger-windows-x64"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item target/release/lan-msg.exe $out/
          Copy-Item target/release/lan-gui.exe $out/
          Copy-Item packaging/windows/* $out/ -Recurse -ErrorAction SilentlyContinue
          Compress-Archive -Path $out -DestinationPath dist/lan-secure-messenger-windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: lan-secure-messenger-windows-x64
          path: dist/lan-secure-messenger-windows-x64.zip

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libayatana-appindicator3-dev libxdo-dev
      - name: Build
        run: cargo build --release -p lan-cli -p lan-gui
      - name: Package
        run: |
          mkdir -p dist/lan-secure-messenger-linux-x64
          cp target/release/lan-msg target/release/lan-gui dist/lan-secure-messenger-linux-x64/
          cp packaging/linux/* dist/lan-secure-messenger-linux-x64/ 2>/dev/null || true
          (cd dist && tar czf lan-secure-messenger-linux-x64.tar.gz lan-secure-messenger-linux-x64)
      - uses: actions/upload-artifact@v4
        with:
          name: lan-secure-messenger-linux-x64
          path: dist/lan-secure-messenger-linux-x64.tar.gz

  release:
    needs: [windows, linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/lan-secure-messenger-windows-x64/lan-secure-messenger-windows-x64.zip
            artifacts/lan-secure-messenger-linux-x64/lan-secure-messenger-linux-x64.tar.gz
          generate_release_notes: true
