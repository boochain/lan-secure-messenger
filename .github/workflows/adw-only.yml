# temporary: verify the GTK 4 GUI job alone on work/g10 (removed before merge)
name: adw-only
on:
  push:
    branches: ["work/g10"]
jobs:
  linux-adw:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: editions/portable } }
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libadwaita-1-dev libgtk-4-dev pkg-config xvfb xcompmgr dbus-x11 xdotool x11-utils imagemagick \
            fonts-noto-cjk language-pack-zh-hans adwaita-icon-theme tesseract-ocr tesseract-ocr-chi-sim python3-numpy python3-opencv python3-pil
          pip install --break-system-packages -q pytesseract
      - run: |
          sh linux/build-adw.sh
          cc -O2 -std=gnu99 -Isrc -DLSM_APP_VERSION='"ci"' -o build/linux-adw/lanmsg-cli src/cli.c src/core.c src/xcrypto.c src/third_party/monocypher.c src/third_party/monocypher-ed25519.c -lpthread
      - run: python3 tests/adw_gui_shots.py build/linux-adw/lan-messenger-adw build/linux-adw/lanmsg-cli shots/adw
      - run: python3 tests/adw_basics.py build/linux-adw/lan-messenger-adw build/linux-adw/lanmsg-cli shots/adw-basics
      - run: python3 tools/ui_color_audit.py --palette tools/palettes/gnome.json --ignore-file shots/adw/audit_ignore.json --out ui-audit/adw shots/adw/page-*.png shots/adw/popup-*.png
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: adw-only, path: "editions/portable/shots/adw-basics" }
