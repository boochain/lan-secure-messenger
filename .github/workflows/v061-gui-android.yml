# Targeted Linux GUI + Android compile for v0.6.1 residual closeout.
name: v061-gui-android
on:
  push:
    branches: ["work/v061-all14", "work/**", main]
  pull_request:
  workflow_dispatch:
jobs:
  linux-gtk:
    runs-on: ubuntu-24.04
    container: ubuntu:20.04
    steps:
      - name: Toolchain
        working-directory: /
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq && apt-get install -y -qq gcc make pkg-config libgtk-3-dev musl-tools curl file ca-certificates git
      - uses: actions/checkout@v4
      - name: Build GTK GUI + static CLI, AppImage + tarball
        working-directory: editions/portable
        run: sh linux/build.sh
      - name: Upload linux dist + overflow checklist
        uses: actions/upload-artifact@v4
        with:
          name: v061-linux-gui
          path: |
            editions/portable/dist/linux/**
            editions/portable/docs/screenshots/v061-overflow-checklist.md
  android-compile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - name: SDK packages (NDK, CMake)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264" "cmake;3.22.1" > /dev/null
      - name: Assemble release APK
        working-directory: editions/portable/android
        run: ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: v061-android
          path: editions/portable/android/app/build/outputs/apk/release/app-release.apk
  linux-adw-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libadwaita-1-dev libgtk-4-dev pkg-config
      - name: Build GTK4 edition
        working-directory: editions/portable
        run: sh linux/build-adw.sh
  xp-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq mingw-w64
      - name: Build XP GUI (x86 + x64)
        working-directory: editions/portable
        run: make build/x86/LanMessenger.exe build/x64/LanMessenger.exe
