# Targeted Linux GUI + Android compile for v0.6.1 residual closeout.
name: v061-gui-android
on:
  push:
    branches: ["work/v061-all14", "work/**"]
  pull_request:
  workflow_dispatch:
jobs:
  linux-gtk-adw:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Deps
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq gcc make pkg-config libgtk-3-dev libadwaita-1-dev curl file
      - name: Build GTK3 GUI + CLI
        working-directory: editions/portable
        run: sh linux/build.sh
      - name: Build ADW GUI (best-effort)
        working-directory: editions/portable
        run: |
          if [ -x linux/build-adw.sh ]; then sh linux/build-adw.sh || echo "adw build soft-fail"; else echo "no adw script"; fi
      - name: Upload linux dist + overflow checklist
        uses: actions/upload-artifact@v4
        with:
          name: v061-linux-gui
          path: |
            editions/portable/dist/linux/**
            editions/portable/docs/screenshots/v061-overflow-checklist.md
  android-compile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Assemble debug APK
        working-directory: editions/portable/android
        run: |
          chmod +x gradlew || true
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: v061-android-debug
          path: editions/portable/android/app/build/outputs/apk/debug/*.apk
