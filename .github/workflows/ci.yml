# One CI for every edition. Push / PR / manual run builds and tests everything; a manually pushed v* tag
# additionally runs the release job, which collects every shipped artifact into ONE GitHub Release.
name: ci
on:
  push:
    branches: [main, "unify/**", "work/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      jobs:
        description: "Comma list of parts to run (windows,portable,relay-server,relay-matrix); empty = all"
        required: false
        default: ""
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  version:        # one version everywhere (VERSION file; on a v* tag the tag must equal it) -- tools/set-version.py
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/set-version.py --check
  windows:        # Rust core tests, lan-daemon/lan-msg, WinUI 3 x64 (+ light/dark UI smoke, colour audit), arm64 package
    if: github.event_name != 'workflow_dispatch' || inputs.jobs == '' || contains(format(',{0},', inputs.jobs), ',windows,')
    uses: ./.github/workflows/windows.yml
  portable:       # C core: XP exe (i686/x64, wine interop), Linux GTK3 AppImage+tarball, GTK4 AppImage, Android APK + emulator, audits
    if: github.event_name != 'workflow_dispatch' || inputs.jobs == '' || contains(format(',{0},', inputs.jobs), ',portable,')
    uses: ./.github/workflows/portable.yml
  relay-server:   # relay server: Linux musl x86_64/aarch64/armv7/i686/riscv64, Windows x64/arm64/x86, deploy scripts
    if: github.event_name != 'workflow_dispatch' || inputs.jobs == '' || contains(format(',{0},', inputs.jobs), ',relay-server,')
    uses: ./.github/workflows/relay-server.yml
  relay-matrix:   # rust <-> C <-> Android, direct LAN + through the relay, resume, mid-transfer path switches
    if: github.event_name != 'workflow_dispatch' || inputs.jobs == '' || contains(format(',{0},', inputs.jobs), ',relay-matrix,')
    uses: ./.github/workflows/relay-client-matrix.yml

  release:
    name: Release (v* tag only, all artifacts in one Release)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [version, windows, portable, relay-server, relay-matrix]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: art }
      - name: Collect shipped files
        run: |
          set -e
          mkdir -p out
          T="${GITHUB_REF_NAME}"
          cp art/LanMessenger-win-x64/*.zip art/LanMessenger-win-arm64/*.zip out/
          cp art/LanMessenger-XP/editions/portable/dist/*.zip out/ 2>/dev/null || cp $(find art/LanMessenger-XP -name '*.zip') out/
          cp $(find art/linux-x86_64 -type f \( -name '*.AppImage' -o -name '*.tar.gz' \)) out/
          cp $(find art/linux-adw-appimage -name '*.AppImage') out/
          cp $(find art/android -name 'app-release.apk') "out/LanMessenger-$T-android.apk"
          for d in art/relay-server-*; do find "$d" -type f \( -name '*.zip' -o -name '*.tar.gz' \) -exec cp {} out/ \; ; done
          (cd out && sha256sum * > SHA256SUMS.txt)
          ls -la out
      - name: Create the Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          T="${GITHUB_REF_NAME}"
          N="docs/release-notes-$T.md"; [ -f "$N" ] || { echo "## $T" > /tmp/notes.md; N=/tmp/notes.md; }
          PRE=""; case "$T" in *-*) PRE="--prerelease";; esac
          LATEST=$([ -z "$PRE" ] && echo --latest || echo --latest=false)
          gh release create "$T" out/* $PRE $LATEST --title "LAN Secure Messenger $T" --notes-file "$N" --target "$GITHUB_SHA"
